<!doctype html>
<html lang="eu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142d3c">
  <meta name="description" content="Kiroldegiko pistak eta erreserbak kudeatzeko web interfazea.">
  <title>Hasi saioa | Kiroldegia</title>
  <link rel="stylesheet" href="css/estiloak.css">
</head>
<body>
  <a class="skip-link" href="#edukia">Joan edukira</a>
  <svg class="svg-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-court" viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="22" rx="2"/><path d="M16 5v22M3 11h26M3 21h26M9 11v10m14-10v10"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 32 32"><rect x="5" y="7" width="22" height="21" rx="3"/><path d="M10 4v7m12-7v7M5 15h22m-16 5h3m4 0h3m-10 4h3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-2 8M20 4v6h-6"/></symbol>
    <symbol id="i-archive" viewBox="0 0 32 32"><rect x="4" y="5" width="24" height="6" rx="1"/><path d="M6 11v15h20V11m-14 5h8m-4 0v6m-3-3 3 3 3-3"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-11v1"/></symbol>
  </svg>

  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="#hasiera" aria-label="Kiroldegia, hasiera">
        <span class="brand-icon"><svg><use href="#i-court"/></svg></span>
        <span><strong>KIROLDEGIA</strong><small>Pistak eta erreserbak</small></span>
      </a>
      <div class="session" id="saio-info"><span class="status-dot"></span><span>Ongi etorri</span></div>
    </div>
  </header>

  <div class="app-shell">
    <nav class="navigation" id="nabigazioa" aria-label="Nabigazio nagusia" hidden>
      <div class="navigation-left">
        <button class="button button-quiet" type="button" data-action="atzera" id="atzera-botoia"><svg><use href="#i-back"/></svg>Atzera</button>
        <button class="breadcrumb" type="button" data-view="hasiera">Hasiera</button>
        <span class="breadcrumb-divider" aria-hidden="true">/</span><span id="atal-izena"></span>
      </div>
      <button class="button button-quiet" type="button" data-action="irten" id="irten-botoia">Saioa itxi <span aria-hidden="true">↗</span></button>
    </nav>
    <div class="preview-notice" id="aurreikuspen-oharra" role="status" hidden>
      <svg><use href="#i-info"/></svg><span>Aurreikuspena · Saioa hasi gabe. Datuak aldatzeko, hasi saioa.</span>
    </div>
    <main id="edukia" tabindex="-1"></main>
    <footer class="footer"><span><span class="footer-mark"></span>KIROLDEGIA</span><span>Pisten eta erreserben kudeaketa</span></footer>
  </div>

  <template id="saioa-txantiloia">
    <section class="login-layout" aria-labelledby="orriko-izenburua">
      <div class="login-copy">
        <span class="eyebrow">BAZKIDEENTZAKO GUNEA</span>
        <h1 id="orriko-izenburua">Zure kirola.<br><span>Zure lekua.</span></h1>
        <p class="intro">Sartu zure bazkidearen IDarekin, eta aukeratu zer kudeatu nahi duzun.</p>
        <form class="login-card" id="saio-inprimakia" novalidate>
          <div class="card-heading"><span class="small-icon"><svg><use href="#i-user"/></svg></span><div><h2>Hasi saioa</h2><p>Ez duzu pasahitzik behar.</p></div></div>
          <label for="bazkide-id">Bazkidearen ID-a</label>
          <input id="bazkide-id" name="bazkideId" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="Sartu zure ID zenbakia" aria-describedby="id-laguntza egoera">
          <p class="field-help" id="id-laguntza">Zure ID-a bazkideen zerrendan egiaztatuko da.</p>
          <button class="button button-primary login-submit" type="submit">Sartu <svg><use href="#i-arrow"/></svg></button>
          <p class="message" id="egoera" role="status" aria-live="polite"></p>
          <div class="preview-link"><button class="text-button" type="button" data-action="aurreikusi">Interfazea aurreikusi <span aria-hidden="true">↗</span></button><small>Saioa hasi gabe</small></div>
        </form>
      </div>
      <aside class="court-art" aria-hidden="true">
        <div class="art-top"><span>KIROLDEGIA</span><span class="art-dots">● ● ●</span></div>
        <div class="court-ground"><div class="court-lines"><span class="court-center"></span><span class="court-service"></span></div><span class="ball"></span></div>
        <div class="art-bottom"><p>Pistak eta erreserbak,<br><strong>toki berean.</strong></p><span class="art-arrow">↗</span></div>
      </aside>
    </section>
  </template>

  <template id="menu-txantiloia">
    <section aria-labelledby="orriko-izenburua">
      <header class="page-heading"><span class="eyebrow" id="orriko-etiketa"></span><h1 id="orriko-izenburua"></h1><p id="orriko-azalpena"></p></header>
      <div class="menu-grid" id="menu-aukerak"></div>
      <p class="menu-help"><svg><use href="#i-info"/></svg><span id="menu-laguntza"></span></p>
    </section>
  </template>

  <template id="taula-txantiloia">
    <section aria-labelledby="orriko-izenburua">
      <header class="page-heading table-heading"><div><span class="eyebrow" id="orriko-etiketa"></span><h1 id="orriko-izenburua"></h1><p id="orriko-azalpena"></p></div><span class="count-badge" id="kopurua">—</span></header>
      <div class="table-card">
        <div class="table-toolbar"><span class="table-caption" id="taula-izena"></span><div class="table-actions"><button class="button button-primary" type="button" data-action="gehitu" id="gehitu-botoia" hidden><svg><use href="#i-plus"/></svg>Erreserba gehitu</button><button class="button button-outline" type="button" data-action="berritu"><svg><use href="#i-refresh"/></svg>Berritu</button></div></div>
        <div class="table-scroll" tabindex="0" aria-label="Datuen taula, horizontalki mugigarria"><table id="datu-taula"><thead><tr id="taula-goiburua"></tr></thead><tbody id="taula-gorputza"></tbody></table></div>
        <div class="table-status"><span class="status-dot"></span><p class="message" id="egoera" role="status" aria-live="polite">Zerrenda kargatzen…</p></div>
      </div>
    </section>
  </template>

  <dialog id="baieztapen-leihoa" aria-labelledby="baieztapen-izenburua" aria-describedby="baieztapen-testua">
    <form method="dialog" class="dialog-content"><span class="dialog-icon"><svg><use href="#i-info"/></svg></span><h2 id="baieztapen-izenburua"></h2><p id="baieztapen-testua"></p><div class="dialog-actions"><button class="button button-outline" value="cancel" autofocus>Utzi</button><button class="button button-danger" id="baieztatu-botoia" value="confirm">Baieztatu</button></div></form>
  </dialog>
  <noscript><p class="noscript">JavaScript aktibatu behar duzu web interfazea erabiltzeko.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
